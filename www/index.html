<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Comandia Cameriere</title>
<style>
  :root { --blu:#3064e8; --blu-chiaro:#eaf0fe; --ink:#101828; --grigio:#667085; --bordo:#e4e7ec; --sfondo:#f7f8fa; --verde:#12b76a; --rosso:#f04438; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; background:var(--sfondo); color:var(--ink); padding-bottom:calc(170px + env(safe-area-inset-bottom)); }
  header { background:#fff; border-bottom:1px solid var(--bordo); padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left)); position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px; }
  .logo { width:32px; height:32px; min-width:32px; border-radius:9px; background:var(--blu); color:#fff; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .chip { padding:8px 12px; border-radius:999px; border:1px solid var(--bordo); background:#fff; font-weight:600; font-size:13px; color:var(--ink); white-space:nowrap; }
  .chip:active { background:var(--blu-chiaro); }
  select, input { font-size:16px; border:1px solid var(--bordo); border-radius:10px; padding:10px; background:#fff; color:var(--ink); }
  .barra { display:flex; gap:8px; padding:10px 12px; align-items:center; }
  .barra select { flex:1; font-weight:700; min-width:0; }
  .coperti { display:flex; align-items:center; gap:5px; }
  .coperti button { width:36px; height:36px; border-radius:10px; border:1px solid var(--bordo); background:#fff; font-size:17px; font-weight:700; }
  .gia-inviato { margin:0 12px 8px; background:#fff; border:1px solid var(--bordo); border-radius:12px; padding:10px 12px; font-size:13px; }
  .gia-inviato b { color:var(--blu); }
  .gia-riga { display:flex; justify-content:space-between; color:var(--grigio); padding:2px 0; }
  .cats { display:flex; gap:7px; overflow-x:auto; padding:0 12px 8px; }
  .cat { padding:8px 14px; border-radius:999px; border:1px solid var(--bordo); background:#fff; font-weight:600; font-size:13px; color:var(--grigio); white-space:nowrap; }
  .cat.attivo { background:var(--ink); color:#fff; border-color:var(--ink); }
  .griglia { display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr)); gap:8px; padding:0 12px; }
  .tile { position:relative; background:#fff; border:1px solid var(--bordo); border-radius:11px; padding:10px; text-align:left; min-height:70px; display:flex; flex-direction:column; justify-content:space-between; font-size:13px; }
  .tile:active { background:var(--blu-chiaro); }
  .tile b { display:block; line-height:1.2; }
  .tile .prezzo { color:var(--blu); font-weight:800; margin-top:5px; font-size:12.5px; }
  .tile .nqty { position:absolute; top:-6px; right:-4px; background:var(--verde); color:#fff; min-width:22px; height:22px; border-radius:999px; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 5px; }
  .carrello { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--bordo); padding:8px calc(12px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); box-shadow:0 -4px 20px rgba(0,0,0,0.08); }
  .car-righe { max-height:30vh; overflow-y:auto; }
  .car-riga { display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px dashed var(--bordo); font-size:14px; }
  .car-riga .nome { flex:1; font-weight:600; min-width:0; }
  .car-riga .sotto { font-size:11.5px; color:var(--blu); font-weight:700; }
  .car-riga .nota-txt { font-size:11.5px; color:var(--grigio); font-weight:400; }
  .car-riga button { width:32px; height:32px; border-radius:9px; border:1px solid var(--bordo); background:#fff; font-weight:700; font-size:15px; }
  .btn-opzioni { position:relative; }
  .btn-opzioni .pallino { position:absolute; top:-5px; right:-5px; background:var(--blu); color:#fff; width:16px; height:16px; border-radius:99px; font-size:10px; display:flex; align-items:center; justify-content:center; }
  .sep-riga { display:flex; align-items:center; gap:8px; padding:5px 0; }
  .sep-linea { flex:1; text-align:center; font-size:11px; font-weight:800; letter-spacing:2px; color:var(--grigio); border-top:2px dashed var(--bordo); border-bottom:2px dashed var(--bordo); padding:3px 0; }
  .sep-riga button { width:28px; height:28px; border-radius:8px; border:1px solid var(--bordo); background:#fff; font-size:13px; }
  #codaBadge { display:none; background:#f79009; color:#fff; border-color:#f79009; }
  .invia { width:100%; margin-top:8px; padding:15px; border:none; border-radius:12px; background:var(--blu); color:#fff; font-size:17px; font-weight:800; }
  .invia:disabled { opacity:0.4; }
  .vuoto { color:var(--grigio); text-align:center; padding:8px; font-size:13px; }
  @media (prefers-reduced-motion: no-preference) {
    .tile { transition: transform .08s, background .12s; }
    .tile:active { transform: scale(.94); }
    .cat, .chip, .chip-mini { transition: background .12s, border-color .12s, color .12s; }
    .car-riga { animation: entraRiga .16s ease-out; }
    @keyframes entraRiga { from { opacity:0; transform: translateX(10px); } to { opacity:1; transform:none; } }
    .sheet { animation: saleSheet .22s cubic-bezier(.2,.9,.3,1); }
    @keyframes saleSheet { from { transform: translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }
    .sheet-sfondo { animation: dissolve .14s ease-out; }
    @keyframes dissolve { from { opacity:0; } to { opacity:1; } }
    .ok-big { animation: pop .25s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { transform: scale(.8); opacity:0; } to { transform:none; opacity:1; } }
    .ok-big .segno { animation: rimbalzo .5s ease-out; }
    @keyframes rimbalzo { 0%{transform:scale(0)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }
    #spiaConn { transition: background .3s; }
  }
  body.testo-grande { font-size:17px; }
  body.testo-grande .tile b { font-size:15px; }
  body.testo-grande .tile .prezzo { font-size:14px; }
  body.testo-grande .car-riga { font-size:16.5px; }
  body.testo-grande .cat, body.testo-grande .chip { font-size:15px; }
  body.testo-grande .invia { font-size:19px; }
  .cat.preferiti { border-color:var(--giallo, #d97706); color:#d97706; font-weight:700; }
  .sheet-sfondo { position:fixed; inset:0; background:rgba(16,24,40,0.5); z-index:50; display:flex; align-items:flex-end; }
  .sheet { background:#fff; border-radius:16px 16px 0 0; width:100%; padding:16px 14px 24px; max-height:80vh; overflow-y:auto; }
  .sheet h3 { margin:0 0 8px; font-size:16px; }
  .sheet .etich { font-size:12px; color:var(--grigio); font-weight:600; margin-top:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip-mini { padding:8px 13px; border-radius:999px; border:1px solid var(--bordo); background:#fff; font-size:13.5px; font-weight:600; }
  .chip-mini.on { background:var(--blu-chiaro); border-color:var(--blu); color:var(--blu); }
  .sheet input { width:100%; }
  .sheet-azioni { display:flex; gap:8px; margin-top:12px; }
  .sheet-azioni button { flex:1; padding:13px; border-radius:11px; font-size:15px; font-weight:700; border:1px solid var(--bordo); background:#fff; }
  .sheet-azioni .salva { background:var(--blu); color:#fff; border-color:var(--blu); }
  .ok-big { position:fixed; inset:0; background:rgba(18,183,106,0.96); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:800; gap:8px; text-align:center; padding:20px; }
  .ok-big .segno { font-size:64px; }
  #config { display:none; position:fixed; inset:0; background:var(--sfondo); z-index:100; padding:24px; align-items:center; justify-content:center; overflow-y:auto; }
  #diagEsito { text-align:left; font-size:12px; background:var(--sfondo); border-radius:10px; padding:10px; margin-top:10px; white-space:pre-wrap; display:none; }
</style>
</head>
<body>
<header>
  <div class="logo">C</div>
  <span id="spiaConn" style="width:10px;height:10px;border-radius:99px;background:var(--grigio);display:inline-block;flex-shrink:0"></span>
  <button class="chip" id="btnCameriere" onclick="apriCamerieri()">👤 —</button>
  <div style="margin-left:auto; display:flex; gap:6px;">
    <button class="chip" id="codaBadge" onclick="processaCoda(true)">⏳ 0</button>
    <button class="chip" onclick="carica(true, true)">↻</button>
    <button class="chip" onclick="mostraConfig()">⚙</button>
  </div>
</header>

<div class="barra">
  <select id="tavolo" onchange="renderGiaInviato(); salvaStato()"></select>
  <div class="coperti" title="Coperti a pagamento">
    <span style="font-size:11px;color:var(--grigio);font-weight:700">💶</span>
    <button onclick="cambiaCoperti(-1)">−</button>
    <span id="ncoperti" style="font-weight:800">0</span>
    <button onclick="cambiaCoperti(1)">+</button>
  </div>
  <div class="coperti" title="Persone sedute (senza addebito)">
    <span style="font-size:11px;color:var(--grigio);font-weight:700">👥</span>
    <button onclick="cambiaPersone(-1)">−</button>
    <span id="npersone" style="font-weight:800">0</span>
    <button onclick="cambiaPersone(1)">+</button>
  </div>
</div>

<div class="gia-inviato" id="giaInviato" style="display:none"></div>
<div id="barraRicerca" style="padding:0 12px 8px">
  <input id="cercaProd" placeholder="🔍 Cerca prodotto…" style="width:100%" oninput="renderGriglia()">
</div>
<div class="cats" id="cats"></div>
<div class="griglia" id="griglia"></div>

<div class="carrello">
  <div class="car-righe" id="carRighe"><div class="vuoto">Tocca i piatti per aggiungerli</div></div>
  <div style="display:flex; gap:8px; margin-top:8px;">
    <button class="chip" style="flex:1" onclick="aggiungiSegue()">┅ Segue (nuova portata)</button>
  </div>
  <button class="invia" id="btnInvia" disabled onclick="invia()">🔔 Invia comanda</button>
</div>

<div id="config">
  <div style="background:#fff; border:1px solid var(--bordo); border-radius:16px; padding:24px; width:100%; max-width:380px; text-align:center; margin:auto;">
    <div class="logo" style="margin:0 auto 10px; width:48px; height:48px; font-size:24px;">C</div>
    <h2 style="margin:0 0 2px">Comandia Cameriere</h2>
    <div style="color:var(--grigio); font-size:12px; margin-bottom:8px;">versione v31</div>
    <p style="color:var(--grigio); font-size:14px;">Indirizzo della cassa<br>(app cassa → Impostazioni → App cameriere)</p>
    <input id="cfgIp" placeholder="es. 192.168.43.10" inputmode="text" autocapitalize="off" autocorrect="off" style="width:100%; font-size:18px; text-align:center;">
    <input id="cfgPin" placeholder="PIN di abbinamento (se impostato in cassa)" inputmode="numeric" style="width:100%; font-size:16px; text-align:center; margin-top:8px;">
    <div id="cfgErr" style="color:var(--rosso); font-size:13px; margin-top:8px; display:none;"></div>
    <button onclick="salvaConfig()" style="width:100%; margin-top:12px; padding:14px; border:none; border-radius:12px; background:var(--blu); color:#fff; font-size:16px; font-weight:800;">Collegati alla cassa</button>
    <button class="chip" style="width:100%; margin-top:10px;" onclick="diagnostica()">🔬 Diagnostica</button>
    <div id="diagEsito"></div>
  </div>
</div>

<script>
const VERSIONE = 'v31'
const PORTA = 8931
const AGGIUNTE = ['Poco', 'Tanto', 'Più', 'Meno', 'Senza', 'Extra']
let dati = { prodotti: [], tavoli: [], operatori: [], ordini: [], aggiunte: {} }
const CATEGORIE_AGG = ['Poco', 'Tanto', 'Più', 'Meno', 'Senza', 'Extra']
const aggLbl = (a) => (typeof a === 'string' ? a : (a.categoria + ' ' + (a.nome || '')).trim())
let categoria = 'Tutte'
let carrello = []
let coperti = 0
let persone = 0

const ipSalvato = () => (localStorage.getItem('comandia-ip') || '').trim()
const BASE = () => 'http://' + ipSalvato() + ':' + PORTA
const pinSalvato = () => (localStorage.getItem('comandia-pin') || '').trim()
const conPin = (percorso) => BASE() + percorso + (pinSalvato() ? (percorso.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(pinSalvato()) : '')
const cameriere = () => localStorage.getItem('comandia-cameriere') || ''

function salvaStato() {
  try {
    localStorage.setItem('comandia-stato', JSON.stringify({
      carrello, coperti, persone, tavoloId: document.getElementById('tavolo').value || '',
    }))
  } catch (e) {}
}
function ripristinaStato() {
  try {
    const st = JSON.parse(localStorage.getItem('comandia-stato') || '{}')
    if (Array.isArray(st.carrello)) carrello = st.carrello
    if (st.coperti) { coperti = st.coperti; document.getElementById('ncoperti').textContent = coperti }
    if (st.persone) { persone = st.persone; document.getElementById('npersone').textContent = persone }
    return st.tavoloId || ''
  } catch (e) { return '' }
}
const vibra = (ms) => { try { navigator.vibrate && navigator.vibrate(ms) } catch (e) {} }
const genCid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8)

function prezzoRiga(r) {
  if (r.sep) return 0
  const p = dati.prodotti.find(x => x.id === r.prodId) || {}
  let tot = p.prezzo || r.prezzo || 0
  for (const nomeV of (r.varianti || [])) {
    const v = (p.varianti || []).find(x => x.nome === nomeV)
    if (v) tot += Number(v.prezzo || 0)
  }
  for (const a of (r.aggiunte || [])) {
    if (typeof a === 'string') continue
    const ing = ((dati.aggiunte || {})[a.categoria] || []).find(x => x.nome === a.nome)
    if (ing) tot += Number(ing.prezzo || 0)
  }
  return Math.max(0, tot)
}
const totaleCarrello = () => carrello.reduce((t, r) => t + prezzoRiga(r) * (r.qty || 0), 0)

function mostraConfig(errore) {
  const c = document.getElementById('config')
  c.style.display = 'flex'
  document.getElementById('cfgIp').value = ipSalvato()
  document.getElementById('cfgPin').value = pinSalvato()
  const e = document.getElementById('cfgErr')
  if (errore) { e.textContent = errore; e.style.display = 'block' } else { e.style.display = 'none' }
}
function salvaConfig() {
  const ip = document.getElementById('cfgIp').value.trim().replace(/,/g, '.').replace(/^https?:\/\//, '').replace(/[:\/].*$/, '')
  if (!ip) return
  localStorage.setItem('comandia-ip', ip)
  localStorage.setItem('comandia-pin', document.getElementById('cfgPin').value.trim())
  document.getElementById('config').style.display = 'none'
  carica(true, true)
}

// ── Diagnostica: mostra l'errore ESATTO ────────────────────────
async function diagnostica() {
  const box = document.getElementById('diagEsito')
  box.style.display = 'block'
  const ip = document.getElementById('cfgIp').value.trim() || ipSalvato()
  const righe = []
  righe.push('Versione app: ' + VERSIONE)
  righe.push('Origine pagina: ' + location.origin)
  righe.push('CapacitorHttp nativo: ' + (window.Capacitor ? 'sì (' + (window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : '?') + ')' : 'NO — pagina fuori da Capacitor'))
  righe.push('IP in prova: ' + (ip || 'NESSUNO'))
  box.textContent = righe.join('\n') + '\n\nTest in corso…'
  if (ip) {
    const url = 'http://' + ip + ':' + PORTA + '/api/dati' + (pinSalvato() ? '?k=' + encodeURIComponent(pinSalvato()) : '')
    try {
      const t0 = Date.now()
      const ctrl = new AbortController()
      setTimeout(() => ctrl.abort(), 6000)
      const r = await fetch(url, { signal: ctrl.signal })
      const corpo = await r.text()
      righe.push('fetch ' + url + ' → HTTP ' + r.status + ' in ' + (Date.now() - t0) + 'ms')
      righe.push('risposta: ' + corpo.slice(0, 120))
      righe.push(r.ok ? '\n✓ TUTTO OK: la cassa risponde. Premi "Collegati".' : '\n✗ La cassa risponde ma con errore.')
    } catch (e) {
      righe.push('fetch → ERRORE: ' + e.name + ' — ' + e.message)
      righe.push('\nSignifica: la richiesta non arriva. Verifica in ordine:')
      righe.push('1. app Comandia APERTA sul PC')
      righe.push('2. dal browser del PC: http://localhost:' + PORTA + ' si apre?')
      righe.push('3. dal browser di QUESTO telefono: http://' + ip + ':' + PORTA + ' si apre?')
      righe.push('4. se 3 sì e qui no → riferisci questo messaggio esatto')
    }
  }
  box.textContent = righe.join('\n')
}

let datiCaricati = false
let opz = {}

async function carica(feedback, manuale) {
  if (!ipSalvato()) return mostraConfig()
  try {
    const ctrl = new AbortController()
    setTimeout(() => ctrl.abort(), 6000)
    const r = await fetch(conPin('/api/dati'), { signal: ctrl.signal })
    if (r.status === 401) {
      spia(false)
      return mostraConfig('PIN di abbinamento mancante o errato: chiedilo alla cassa (Impostazioni → App cameriere).')
    }
    dati = await r.json()
    dati.operatori = dati.operatori || []
    dati.ordini = dati.ordini || []
    dati.aggiunte = dati.aggiunte || {}
    dati.topProdotti = dati.topProdotti || []
    opz = dati.opzioni || {}
    datiCaricati = true
    spia(true)
    applicaOpzioni()
    renderTutto()
    if (feedback) vibra(30)
  } catch (e) {
    spia(false)
    // il calo di rete durante gli aggiornamenti automatici non interrompe il servizio
    if (manuale || !datiCaricati) {
      mostraConfig('Cassa non raggiungibile (' + (e.name === 'AbortError' ? 'timeout' : e.message) + '). Usa 🔬 Diagnostica per il dettaglio.')
    }
  }
}

function spia(ok) {
  const el = document.getElementById('spiaConn')
  if (!el) return
  el.style.display = opz.spia === false ? 'none' : 'inline-block'
  el.style.background = ok ? 'var(--verde)' : 'var(--rosso)'
  el.title = ok ? 'Collegato alla cassa' : 'Cassa non raggiungibile'
}

// wake lock: schermo acceso durante il servizio
let wakeLock = null
async function tieniAcceso() {
  if (opz.schermoAcceso === false) {
    try { wakeLock && wakeLock.release() } catch (e) {}
    wakeLock = null
    return
  }
  try {
    if (!wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen')
      wakeLock.addEventListener('release', () => { wakeLock = null })
    }
  } catch (e) {}
}

function applicaOpzioni() {
  document.body.classList.toggle('testo-grande', opz.testoGrande === true)
  const ricerca = document.getElementById('barraRicerca')
  if (ricerca) ricerca.style.display = opz.ricerca === false ? 'none' : 'block'
  tieniAcceso()
}

function renderTutto() {
  document.getElementById('btnCameriere').textContent = '👤 ' + (cameriere() || 'Chi sei?')
  renderTavoli(); renderCats(); renderGriglia(); renderCarrello(); renderGiaInviato()
}

function renderTavoli() {
  const sel = document.getElementById('tavolo')
  if (document.activeElement === sel) return // non rigenerare mentre il cameriere la sta usando
  const val = sel.value
  sel.innerHTML = '<option value="">— Scegli tavolo —</option>' +
    dati.tavoli.map(t => {
      const o = dati.ordini.find(x => x.tavoloId === t.id)
      return `<option value="${t.id}">${t.nome}${o ? ' ● (' + o.righe.reduce((a, r) => a + r.qty, 0) + ' pz)' : ''}</option>`
    }).join('')
  if (val) sel.value = val
}

let giaAperto = null // null = usa il default dalle opzioni
function toggleGia() {
  giaAperto = !(giaAperto === null ? opz.contoChiuso === false : giaAperto)
  renderGiaInviato()
}
function renderGiaInviato() {
  const div = document.getElementById('giaInviato')
  const tavoloId = document.getElementById('tavolo').value
  const o = dati.ordini.find(x => x.tavoloId === tavoloId)
  if (!o || o.righe.length === 0) { div.style.display = 'none'; giaAperto = null; return }
  div.style.display = 'block'
  const aperto = giaAperto === null ? opz.contoChiuso === false : giaAperto
  const pezzi = o.righe.reduce((a, r) => a + r.qty, 0)
  div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleGia()">
      <span><b>Già al tavolo</b> ${o.cameriere ? '· 👤 ' + o.cameriere : ''} · ${pezzi} pz · ${o.coperti} coperti</span>
      <span>${aperto ? '▲' : '▼'}</span>
    </div>` +
    (aperto
      ? o.righe.map(r => `<div class="gia-riga"><span>${r.qty}× ${r.nome}</span></div>`).join('') +
        `<button class="chip" style="margin-top:8px;width:100%" onclick="richiediPreconto()">🧾 Stampa preconto in cassa</button>`
      : '')
}

function renderCats() {
  const cats = ['Tutte', ...new Set(dati.prodotti.map(p => p.categoria))]
  if (opz.preferiti !== false && (dati.topProdotti || []).length) cats.splice(1, 0, '★ Preferiti')
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="cat ${c === categoria ? 'attivo' : ''} ${c === '★ Preferiti' ? 'preferiti' : ''}" onclick="setCat('${c.replace(/'/g, "\\'")}')">${c}</button>`
  ).join('')
}
function setCat(c) { categoria = c; renderCats(); renderGriglia() }

function renderGriglia() {
  const cerca = (document.getElementById('cercaProd')?.value || '').toLowerCase()
  let lista
  if (categoria === '★ Preferiti') {
    lista = (dati.topProdotti || []).map(id => dati.prodotti.find(p => p.id === id)).filter(Boolean)
  } else {
    lista = dati.prodotti.filter(p => categoria === 'Tutte' || p.categoria === categoria)
  }
  if (cerca) lista = dati.prodotti.filter(p => p.nome.toLowerCase().includes(cerca))
  document.getElementById('griglia').innerHTML = lista.map(p => {
    const inCar = carrello.filter(r => !r.sep && r.prodId === p.id).reduce((a, r) => a + r.qty, 0)
    return `<button class="tile" onclick="aggiungi('${p.id}')">
      ${inCar ? `<span class="nqty">${inCar}</span>` : ''}
      <b>${p.nome}</b>
      <span class="prezzo">€ ${p.prezzo.toFixed(2).replace('.', ',')}</span>
    </button>`
  }).join('')
}

function aggiungi(id) {
  const p = dati.prodotti.find(x => x.id === id)
  const ultimoSep = carrello.map(x => !!x.sep).lastIndexOf(true)
  const r = carrello.find((x, i) => i > ultimoSep && x.prodId === id && !x.nota && !(x.aggiunte || []).length && !(x.varianti || []).length)
  if (r) r.qty++
  else carrello.push({ prodId: p.id, nome: p.nome, prezzo: p.prezzo, qty: 1, nota: '', aggiunte: [], varianti: [] })
  vibra(15)
  renderCarrello(); renderGriglia()
  salvaStato()
}

function aggiungiSegue() {
  if (carrello.length === 0) return
  // toggle: se l'ultimo elemento è già un SEGUE lo tolgo, altrimenti lo aggiungo
  if (carrello[carrello.length - 1].sep) carrello.pop()
  else carrello.push({ sep: true })
  vibra(15)
  renderCarrello()
  salvaStato()
}
function togliSegue(i) { carrello.splice(i, 1); renderCarrello(); salvaStato() }

function cambia(i, delta) {
  carrello[i].qty += delta
  if (carrello[i].qty <= 0) carrello.splice(i, 1)
  while (carrello[0] && carrello[0].sep) carrello.shift()
  while (carrello.length && carrello[carrello.length - 1].sep) carrello.pop()
  renderCarrello(); renderGriglia()
  salvaStato()
}

function cambiaCoperti(d) {
  coperti = Math.max(0, coperti + d)
  document.getElementById('ncoperti').textContent = coperti
  salvaStato()
}

function cambiaPersone(d) {
  persone = Math.max(0, persone + d)
  document.getElementById('npersone').textContent = persone
  salvaStato()
}

function renderCarrello() {
  const div = document.getElementById('carRighe')
  if (carrello.length === 0) {
    div.innerHTML = '<div class="vuoto">Tocca i piatti per aggiungerli</div>'
  } else {
    div.innerHTML = carrello.map((r, i) => {
      if (r.sep) {
        const num = carrello.slice(0, i + 1).filter(x => x.sep).length
        return `<div class="sep-riga"><div class="sep-linea">┅┅ SEGUE ${num} ┅┅</div><button onclick="togliSegue(${i})">✕</button></div>`
      }
      const nOpz = (r.aggiunte || []).length + (r.varianti || []).length + (r.nota ? 1 : 0)
      const sotto = [...(r.varianti || []).map(v => '+ ' + v), ...(r.aggiunte || []).map(aggLbl)].join(' · ')
      return `<div class="car-riga">
        <button class="btn-opzioni" onclick="apriOpzioni(${i})">✎${nOpz ? `<span class="pallino">${nOpz}</span>` : ''}</button>
        <span class="nome" onclick="apriOpzioni(${i})">${r.nome}
          ${sotto ? `<div class="sotto">${sotto}</div>` : ''}
          ${r.nota ? `<div class="nota-txt">📝 ${r.nota}</div>` : ''}
        </span>
        <button onclick="cambia(${i}, -1)">−</button>
        <b>${r.qty}</b>
        <button onclick="cambia(${i}, 1)">+</button>
        <span style="min-width:52px;text-align:right;font-weight:700;font-size:12.5px">€ ${(prezzoRiga(r) * r.qty).toFixed(2).replace('.', ',')}</span>
      </div>`
    }).join('')
  }
  const btn = document.getElementById('btnInvia')
  btn.disabled = !carrello.some(r => !r.sep)
  const tot = totaleCarrello()
  btn.textContent = tot > 0 ? '🔔 Invia comanda — € ' + tot.toFixed(2).replace('.', ',') : '🔔 Invia comanda'
}

function apriOpzioni(i) {
  const r = carrello[i]
  if (!r || r.sep) return
  const prodotto = dati.prodotti.find(p => p.id === r.prodId) || {}
  const varianti = prodotto.varianti || []
  let selAgg = (r.aggiunte || []).map(a => (typeof a === 'string' ? { categoria: a, nome: '' } : a))
  let selVar = [...(r.varianti || [])]
  const cfg = dati.aggiunte || {}
  const chipAgg = (cat, nome, prezzo) => {
    const lbl = nome ? `${nome}${Number(prezzo) ? (prezzo > 0 ? ' +' : ' ') + '€' + Number(prezzo).toFixed(2) : ''}` : cat
    return `<button class="chip-mini" data-cat="${cat}" data-nome="${nome || ''}">${lbl}</button>`
  }
  const sezioniAgg = CATEGORIE_AGG.map(cat => {
    const ings = cfg[cat] || []
    if (!ings.length) return ''
    return `<div class="sez-agg" data-sez="${cat}">
      <div class="etich">${cat.toUpperCase()}</div>
      <div class="chips">${ings.map(x => chipAgg(cat, x.nome, x.prezzo)).join('')}</div>
    </div>`
  }).join('')
  const overlay = document.createElement('div')
  overlay.className = 'sheet-sfondo'
  overlay.innerHTML = `<div class="sheet">
    <h3>${r.nome}</h3>
    ${varianti.length ? `<div class="etich">VARIANTI (si pagano)</div>
    <div class="chips">${varianti.map(v => `<button class="chip-mini" data-var="${v.nome}">+ ${v.nome} €${Number(v.prezzo).toFixed(2)}</button>`).join('')}</div>` : ''}
    <div class="etich">AGGIUNTE</div>
    <input id="cercaIng" placeholder="🔍 Cerca ingrediente…" style="margin:4px 0 2px">
    ${sezioniAgg}
    <div class="etich">NOTA PER LA PREPARAZIONE</div>
    <input id="notaInput" placeholder="es. ben cotta, senza cipolla…" value="${(r.nota || '').replace(/"/g, '&quot;')}">
    <div class="sheet-azioni">
      <button onclick="this.closest('.sheet-sfondo').remove()">Annulla</button>
      <button class="salva" id="opzSalva">💾 Salva</button>
    </div>
  </div>`
  document.body.appendChild(overlay)
  const stessa = (a, cat, nome) => a.categoria === cat && (a.nome || '') === (nome || '')
  const aggiorna = () => {
    overlay.querySelectorAll('[data-cat]').forEach(b =>
      b.classList.toggle('on', selAgg.some(a => stessa(a, b.dataset.cat, b.dataset.nome))))
    overlay.querySelectorAll('[data-var]').forEach(b => b.classList.toggle('on', selVar.includes(b.dataset.var)))
  }
  overlay.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    const cat = b.dataset.cat, nome = b.dataset.nome
    selAgg = selAgg.some(a => stessa(a, cat, nome))
      ? selAgg.filter(a => !stessa(a, cat, nome))
      : [...selAgg, { categoria: cat, nome }]
    aggiorna()
  })
  const cerca = overlay.querySelector('#cercaIng')
  if (cerca) cerca.oninput = () => {
    const q = cerca.value.toLowerCase()
    overlay.querySelectorAll('[data-cat]').forEach(b => {
      const visibile = !q || (b.dataset.nome || '').toLowerCase().includes(q)
      b.style.display = visibile ? '' : 'none'
    })
    overlay.querySelectorAll('.sez-agg').forEach(sez => {
      const qualcuno = [...sez.querySelectorAll('[data-cat]')].some(b => b.style.display !== 'none')
      sez.style.display = qualcuno ? '' : 'none'
    })
  }
  overlay.querySelectorAll('[data-var]').forEach(b => b.onclick = () => {
    const v = b.dataset.var
    selVar = selVar.includes(v) ? selVar.filter(x => x !== v) : [...selVar, v]
    aggiorna()
  })
  aggiorna()
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove() }
  overlay.querySelector('#opzSalva').onclick = () => {
    r.nota = overlay.querySelector('#notaInput').value.trim()
    r.aggiunte = selAgg
    r.varianti = selVar
    overlay.remove()
    renderCarrello()
    salvaStato()
  }
}

function apriCamerieri() {
  const overlay = document.createElement('div')
  overlay.className = 'sheet-sfondo'
  const nomi = dati.operatori.length ? dati.operatori : []
  overlay.innerHTML = `<div class="sheet">
    <h3>Chi sta servendo?</h3>
    <div class="chips">
      ${nomi.map(n => `<button class="chip-mini ${n === cameriere() ? 'on' : ''}" data-nome="${n}">👤 ${n}</button>`).join('')}
    </div>
    ${!nomi.length ? '<p style="color:var(--grigio);font-size:13px">Nessun operatore in cassa: scrivi il nome a mano.</p>' : ''}
    <div class="etich">OPPURE SCRIVI IL NOME</div>
    <input id="nomeInput" placeholder="Nome cameriere" value="${cameriere().replace(/"/g, '&quot;')}">
    <div class="sheet-azioni">
      <button onclick="this.closest('.sheet-sfondo').remove()">Annulla</button>
      <button class="salva" id="nomeSalva">💾 OK</button>
    </div>
  </div>`
  document.body.appendChild(overlay)
  overlay.querySelectorAll('[data-nome]').forEach(b => b.onclick = () => {
    localStorage.setItem('comandia-cameriere', b.dataset.nome)
    overlay.remove()
    renderTutto()
  })
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove() }
  overlay.querySelector('#nomeSalva').onclick = () => {
    localStorage.setItem('comandia-cameriere', overlay.querySelector('#nomeInput').value.trim())
    overlay.remove()
    renderTutto()
  }
}

async function richiediPreconto() {
  const tavoloId = document.getElementById('tavolo').value
  if (!tavoloId) return
  try {
    const r = await fetch(conPin('/api/preconto'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tavoloId, cameriere: cameriere() }),
    })
    if (!r.ok) throw new Error('risposta ' + r.status)
    vibra([40, 60, 40])
    const ok = document.createElement('div')
    ok.className = 'ok-big'
    ok.innerHTML = '<div class="segno">🧾</div><div>Preconto in stampa in cassa</div>'
    document.body.appendChild(ok)
    setTimeout(() => ok.remove(), 1300)
  } catch (e) {
    alert('Richiesta non riuscita: ' + e.message)
  }
}

async function invia(confermato) {
  if (!cameriere()) {
    vibra([60, 40, 60])
    apriCamerieri()
    return
  }
  const tavoloId = document.getElementById('tavolo').value
  if (!tavoloId) { vibra([60, 40, 60]); return alert('Scegli prima il tavolo!') }
  if (opz.riepilogo === true && !confermato) {
    const nomeTav = (dati.tavoli.find(t => t.id === tavoloId) || {}).nome || ''
    const pezzi = carrello.filter(r => !r.sep).reduce((a, r) => a + r.qty, 0)
    const overlay = document.createElement('div')
    overlay.className = 'sheet-sfondo'
    overlay.innerHTML = `<div class="sheet">
      <h3>Confermi l'invio?</h3>
      <p style="margin:4px 0"><b>${nomeTav}</b> · ${pezzi} pezzi · € ${totaleCarrello().toFixed(2).replace('.', ',')}</p>
      ${carrello.filter(r => !r.sep).map(r => `<div class="gia-riga"><span>${r.qty}× ${r.nome}</span></div>`).join('')}
      <div class="sheet-azioni">
        <button onclick="this.closest('.sheet-sfondo').remove()">↩ Modifica</button>
        <button class="salva" onclick="this.closest('.sheet-sfondo').remove(); invia(true)">🔔 Conferma e invia</button>
      </div>
    </div>`
    document.body.appendChild(overlay)
    return
  }
  const btn = document.getElementById('btnInvia')
  btn.disabled = true
  btn.textContent = 'Invio…'
  const corpo = JSON.stringify({
    cid: genCid(),
    tavoloId, coperti, persone,
    cameriere: cameriere(),
    righe: carrello.map(x => x.sep ? { sep: true } : ({ prodId: x.prodId, qty: x.qty, nota: x.nota, aggiunte: x.aggiunte || [], varianti: x.varianti || [] })),
  })
  const tavoloNome = (dati.tavoli.find(t => t.id === tavoloId) || {}).nome || ''
  const svuota = () => {
    carrello = []; coperti = 0; persone = 0
    document.getElementById('ncoperti').textContent = 0
    document.getElementById('npersone').textContent = 0
    renderCarrello(); renderGriglia()
    salvaStato()
  }
  try {
    const ctrl = new AbortController()
    setTimeout(() => ctrl.abort(), 6000)
    const r = await fetch(conPin('/api/comanda'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: corpo,
      signal: ctrl.signal,
    })
    if (!r.ok) throw new Error('risposta ' + r.status)
    svuota()
    vibra([40, 60, 40])
    const ok = document.createElement('div')
    ok.className = 'ok-big'
    ok.innerHTML = '<div class="segno">✓</div><div>Comanda inviata!</div><div style="font-size:15px;font-weight:600">' + tavoloNome + '</div>'
    document.body.appendChild(ok)
    setTimeout(() => ok.remove(), 1400)
    carica()
  } catch (e) {
    const coda = codaGet()
    coda.push({ corpo, tavoloNome, quando: Date.now() })
    localStorage.setItem('comandia-coda', JSON.stringify(coda))
    aggiornaCodaBadge()
    svuota()
    vibra([80, 50, 80])
    const ok = document.createElement('div')
    ok.className = 'ok-big'
    ok.style.background = 'rgba(247,144,9,0.96)'
    ok.innerHTML = '<div class="segno">⏳</div><div>Rete assente: comanda in coda</div><div style="font-size:15px;font-weight:600">Parte da sola appena torna la WiFi</div>'
    document.body.appendChild(ok)
    setTimeout(() => ok.remove(), 2000)
  } finally {
    renderCarrello()
  }
}

// ── coda offline ──
function codaGet() { try { return JSON.parse(localStorage.getItem('comandia-coda') || '[]') } catch (e) { return [] } }
function aggiornaCodaBadge() {
  const n = codaGet().length
  const b = document.getElementById('codaBadge')
  b.style.display = n > 0 ? 'inline-block' : 'none'
  b.textContent = '⏳ ' + n
}
let codaInCorso = false
async function processaCoda(manuale) {
  if (codaInCorso) return
  let coda = codaGet()
  if (coda.length === 0) return
  codaInCorso = true
  let inviate = 0
  for (const item of [...coda]) {
    try {
      const ctrl = new AbortController()
      setTimeout(() => ctrl.abort(), 5000)
      const r = await fetch(conPin('/api/comanda'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: item.corpo, signal: ctrl.signal })
      if (!r.ok) throw new Error()
      coda = coda.filter(x => x !== item)
      localStorage.setItem('comandia-coda', JSON.stringify(coda))
      inviate++
    } catch (e) { break }
  }
  codaInCorso = false
  aggiornaCodaBadge()
  if (inviate > 0) {
    vibra([40, 60, 40])
    const ok = document.createElement('div')
    ok.className = 'ok-big'
    ok.innerHTML = '<div class="segno">✓</div><div>' + inviate + (inviate === 1 ? ' comanda in coda inviata!' : ' comande in coda inviate!') + '</div>'
    document.body.appendChild(ok)
    setTimeout(() => ok.remove(), 1600)
    carica()
  } else if (manuale) {
    vibra([60, 40, 60])
  }
}
setInterval(() => { if (ipSalvato()) processaCoda() }, 10000)
setInterval(() => { if (document.visibilityState === 'visible' && ipSalvato()) carica() }, 45000)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ipSalvato()) { carica(); tieniAcceso() } })

aggiornaCodaBadge()
const tavoloSalvato = ripristinaStato()
if (!ipSalvato()) mostraConfig()
else {
  carica().then(() => {
    if (tavoloSalvato) { document.getElementById('tavolo').value = tavoloSalvato; renderGiaInviato() }
    renderCarrello(); renderGriglia()
    if (!cameriere()) apriCamerieri()
  })
  processaCoda()
}
</script>
